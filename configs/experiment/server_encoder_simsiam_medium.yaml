name: server_encoder_simsiam_medium
output_dir: outputs/server_encoder_simsiam_medium
data:
  backend: cyclone_kvikio
  root: ${GK_CYCLONE_DATA_ROOT}
  split: train
  input_fields: [df]
  target_flux: true
  target_spectra: [kyspec, fluxspec]
  context_length: 8
  prediction_length: 1
  batch_size: 4
  shuffle: true
  num_workers: 0
  seed: 52
  normalization:
    mode: none
    mean: null
    std: null
  augmentations:
    gaussian_noise_std: 0.01
    amplitude_jitter_std: 0.02
    mask_probability: 0.02
    channel_dropout_probability: 0.0
    periodic_shift: false
    max_periodic_shift: 0
  cyclone:
    trajectories: null
    fields_to_load: [df]
    conditions: [itg, dg, s_hat, q]
    normalization: null
    normalization_scope: dataset
    normalization_stats: null
    spatial_ifft: true
    real_potens: true
    bundle_seq_length: 1
    offset: 80
    tail_offset: 0
    subsample: 8
    separate_zf: true
    decouple_mu: false
    prefer_dtype: float32
    use_kvikio: true
    return_jax: false
model:
  encoder:
    type: conv_nd
    latent_dim: 128
    hidden_dims: [8, 16, 32]
    activation: gelu
    dropout_rate: 0.0
    extra:
      channels: [8, 16, 32]
      kernel_size: [1, 1, 1, 1, 1]
      strides:
        - [2, 2, 2, 4, 2]
        - [2, 1, 2, 4, 2]
        - [2, 1, 1, 2, 2]
  diagnostics:
    flux_dim: 1
    spectra_dims:
      kyspec: 32
      fluxspec: 32
    hidden_dims: [256]
    dropout_rate: 0.0
  simsiam:
    projection_dim: 128
    projection_hidden_dim: 256
    projection_layers: 2
    prediction_hidden_dim: 64
  sequence: null
training:
  max_steps: 500
  epochs: null
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 25
  gradient_clip_norm: 1.0
  log_every: 25
  eval_every: 100
  checkpoint_every: 500
  dtype: float32
  jit: true
  seed: 52
loss:
  simsiam_weight: 0.5
  flux_weight: 1.0
  spectra_weight: 1.0
  latent_weight: 1.0
  use_log_spectra: false
  spectra_epsilon: 0.000001
  latent_loss: mse
evaluation:
  rollout_steps: 16
  batch_size: 4
  metrics: [latent_mse, flux_mse, spectra_mse]
parallel:
  mode: auto
  axis_name: devices
  min_devices: 1
  require_all_visible_devices: false
  drop_remainder: true
  auto_scale_learning_rate: false
  log_device_summary: true
