name: real_one_trajectory_sequence
output_dir: ${GK_FAST_ROOT}/outputs/one_trajectory_sequence
data:
  backend: cyclone_kvikio
  root: ${GK_CYCLONE_DATA_ROOT}
  split: train
  input_fields: [df]
  target_flux: true
  target_spectra: [kyspec, fluxspec]
  context_length: 4
  prediction_length: 1
  batch_size: 1
  shuffle: true
  seed: 46
  normalization:
    mode: none
    mean: null
    std: null
  cyclone:
    trajectories: [iteration_0]
    fields_to_load: [df]
    conditions: [itg, dg, s_hat, q]
    normalization: null
    normalization_scope: dataset
    normalization_stats: null
    spatial_ifft: true
    real_potens: true
    bundle_seq_length: 1
    offset: 80
    tail_offset: 0
    subsample: 16
    separate_zf: true
    decouple_mu: false
    prefer_dtype: float32
    use_kvikio: false
    return_jax: false
model:
  encoder:
    type: conv_nd
    latent_dim: 64
    hidden_dims: [4, 8]
    activation: gelu
    dropout_rate: 0.0
    extra:
      channels: [4, 8]
      kernel_size: [1, 1, 1, 1, 1]
      strides:
        - [2, 2, 2, 4, 2]
        - [2, 1, 2, 4, 2]
  diagnostics:
    flux_dim: 1
    spectra_dims:
      kyspec: 32
      fluxspec: 32
    hidden_dims: [128]
    dropout_rate: 0.0
  sequence:
    type: guppy_latent_transformer
    latent_dim: 64
    context_length: 4
    hidden_dims: [128]
    extra:
      model_dim: 128
      depth: 2
      num_heads: 4
      mlp_ratio: 4.0
      dropout_rate: 0.0
      predict_delta: false
training:
  max_steps: 200
  learning_rate: 0.001
  weight_decay: 0.0
  warmup_steps: 0
  gradient_clip_norm: 1.0
  log_every: 10
  eval_every: 50
  checkpoint_every: 50
  seed: 46
loss:
  simsiam_weight: 0.0
  flux_weight: 1.0
  spectra_weight: 1.0
  latent_weight: 1.0
  use_log_spectra: false
  spectra_epsilon: 0.000001
  latent_loss: mse_plus_cosine
evaluation:
  rollout_steps: 4
  metrics: [latent_mse, flux_mse, spectra_mse]
latent_cache:
  path: ${GK_FAST_ROOT}/latent_cache/one_trajectory_latents.h5
  encoder_checkpoint_path: outputs/server_encoder_supervised_small/checkpoints/step_000100
  sequence_checkpoint_path: null
  use_persistence_baseline: false
  latent_normalization: cache
  latent_normalization_split: all
  latent_normalization_epsilon: 0.000001
logging:
  wandb:
    enabled: false
    project: gk-latent-surrogate
    entity: null
    mode: disabled
    group: real-data-single-trajectory
    name: cyclone-single-trajectory-guppy-latent-training
    tags: [cyclone, single-trajectory, sequence-training, guppy-latent-transformer]
    log_artifacts: false
    directory: null
parallel:
  mode: auto
  axis_name: devices
  min_devices: 1
  require_all_visible_devices: false
  drop_remainder: true
  auto_scale_learning_rate: false
  log_device_summary: true
