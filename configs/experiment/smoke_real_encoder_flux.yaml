name: smoke_real_encoder_flux
output_dir: outputs/smoke_real_encoder_flux
data:
  backend: cyclone_kvikio
  root: ${GK_CYCLONE_DATA_ROOT}
  split: all
  input_fields: [df]
  target_flux: true
  target_spectra: [kyspec, fluxspec]
  context_length: 4
  prediction_length: 1
  batch_size: 1
  shuffle: false
  num_workers: 0
  seed: 42
  normalization:
    mode: none
    mean: null
    std: null
  cyclone:
    trajectories: [iteration_0]
    fields_to_load: [df]
    conditions: [itg, dg, s_hat, q]
    normalization: null
    normalization_scope: dataset
    normalization_stats: null
    spatial_ifft: true
    real_potens: true
    bundle_seq_length: 1
    offset: 80
    tail_offset: 0
    subsample: 32
    separate_zf: true
    decouple_mu: false
    prefer_dtype: float32
    use_kvikio: false
    return_jax: false
model:
  encoder:
    type: conv_nd
    latent_dim: 32
    hidden_dims: [1]
    activation: gelu
    dropout_rate: 0.0
    extra:
      channels: [1]
      kernel_size: [1, 1, 1, 1, 1]
      strides:
        - [4, 2, 2, 8, 4]
  diagnostics:
    flux_dim: 1
    spectra_dims:
      kyspec: 32
      fluxspec: 32
    hidden_dims: [64]
    dropout_rate: 0.0
  simsiam: null
  sequence: null
training:
  max_steps: 2
  epochs: null
  learning_rate: 0.001
  weight_decay: 0.0
  warmup_steps: 0
  gradient_clip_norm: null
  log_every: 1
  eval_every: 2
  checkpoint_every: 2
  dtype: float32
  jit: true
  seed: 42
loss:
  simsiam_weight: 0.0
  flux_weight: 1.0
  spectra_weight: 1.0
  latent_weight: 1.0
  use_log_spectra: false
  spectra_epsilon: 0.000001
  latent_loss: mse
evaluation:
  rollout_steps: 1
  batch_size: 1
  metrics: [latent_mse, flux_mse, spectra_mse]
