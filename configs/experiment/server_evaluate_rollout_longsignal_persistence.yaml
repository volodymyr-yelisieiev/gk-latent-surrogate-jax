name: server_evaluate_rollout_longsignal_persistence
output_dir: outputs/server_evaluate_rollout_longsignal_persistence
data:
  backend: cyclone_kvikio
  root: ${GK_CYCLONE_DATA_ROOT}
  split: test
  input_fields: [df]
  target_flux: true
  target_spectra: [kyspec, fluxspec]
  context_length: 16
  prediction_length: 1
  batch_size: 4
  shuffle: false
  num_workers: 0
  seed: 72
  normalization:
    mode: none
    mean: null
    std: null
  cyclone:
    trajectories: null
    fields_to_load: [df]
    conditions: [itg, dg, s_hat, q]
    normalization: null
    normalization_scope: dataset
    normalization_stats: null
    spatial_ifft: true
    real_potens: true
    bundle_seq_length: 1
    offset: 80
    tail_offset: 0
    subsample: 4
    separate_zf: true
    decouple_mu: false
    prefer_dtype: float32
    use_kvikio: true
    return_jax: false
model:
  encoder:
    type: conv_nd
    latent_dim: 128
    hidden_dims: [8, 16, 32]
    activation: gelu
    dropout_rate: 0.0
  diagnostics:
    flux_dim: 1
    spectra_dims:
      kyspec: 32
      fluxspec: 32
    hidden_dims: [256]
    dropout_rate: 0.0
  sequence:
    type: gru
    latent_dim: 128
    context_length: 16
    hidden_dims: [256]
    extra:
      hidden_dim: 256
      num_layers: 1
      dropout_rate: 0.0
training:
  max_steps: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 0
  log_every: 1
  eval_every: 1
  checkpoint_every: 1
  dtype: float32
  jit: true
  seed: 72
loss:
  simsiam_weight: 0.0
  flux_weight: 1.0
  spectra_weight: 1.0
  latent_weight: 1.0
  use_log_spectra: false
  spectra_epsilon: 0.000001
  latent_loss: mse_plus_cosine
evaluation:
  rollout_steps: 16
  batch_size: 4
  metrics: [latent_mse, latent_cosine, flux_mse, spectra_mse]
latent_cache:
  path: outputs/latent_cache/server_longsignal/latent_cache.h5
  encoder_checkpoint_path: outputs/server_encoder_simsiam_longsignal/checkpoints/step_000500
  sequence_checkpoint_path: null
  use_persistence_baseline: true
  latent_normalization: cache
parallel:
  mode: auto
  axis_name: devices
  min_devices: 1
  require_all_visible_devices: false
  drop_remainder: true
  auto_scale_learning_rate: false
  log_device_summary: true
