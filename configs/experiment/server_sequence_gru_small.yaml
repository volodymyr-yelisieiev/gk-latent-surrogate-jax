name: server_sequence_gru_small
output_dir: outputs/server_sequence_gru_small
data:
  backend: cyclone_kvikio
  root: ${GK_CYCLONE_DATA_ROOT}
  split: train
  input_fields: [df]
  target_flux: true
  target_spectra: [kyspec, fluxspec]
  context_length: 8
  prediction_length: 1
  batch_size: 8
  shuffle: true
  seed: 42
  normalization:
    mode: none
    mean: null
    std: null
  cyclone:
    trajectories:
      - ${GK_SMALL_VALIDATION_TRAJ_0}
      - ${GK_SMALL_VALIDATION_TRAJ_1}
      - ${GK_SMALL_VALIDATION_TRAJ_2}
      - ${GK_SMALL_VALIDATION_TRAJ_3}
    fields_to_load: [df]
    conditions: [itg, dg, s_hat, q]
    normalization: null
    normalization_scope: dataset
    normalization_stats: null
    spatial_ifft: true
    real_potens: true
    bundle_seq_length: 1
    offset: 80
    tail_offset: 0
    subsample: 16
    separate_zf: true
    decouple_mu: false
    prefer_dtype: float32
    use_kvikio: false
    return_jax: false
model:
  encoder:
    type: conv_nd
    latent_dim: 64
    hidden_dims: [4, 8]
    activation: gelu
    dropout_rate: 0.0
  diagnostics:
    flux_dim: 1
    spectra_dims:
      kyspec: 32
      fluxspec: 32
    hidden_dims: [128]
    dropout_rate: 0.0
  sequence:
    type: gru
    latent_dim: 64
    context_length: 8
    hidden_dims: [128]
    extra:
      hidden_dim: 128
      num_layers: 1
      dropout_rate: 0.0
training:
  max_steps: 100
  learning_rate: 0.001
  weight_decay: 0.0
  warmup_steps: 0
  gradient_clip_norm: 1.0
  log_every: 10
  eval_every: 50
  checkpoint_every: 100
  seed: 44
loss:
  simsiam_weight: 0.0
  flux_weight: 1.0
  spectra_weight: 1.0
  latent_weight: 1.0
  use_log_spectra: false
  spectra_epsilon: 0.000001
  latent_loss: mse_plus_cosine
evaluation:
  rollout_steps: 3
  metrics: [latent_mse, flux_mse, spectra_mse]
latent_cache:
  path: outputs/latent_cache/server_small/latent_cache.h5
  encoder_checkpoint_path: outputs/server_encoder_simsiam_small/checkpoints/step_000100
  sequence_checkpoint_path: null
  use_persistence_baseline: false
parallel:
  mode: auto
  axis_name: devices
  min_devices: 1
  require_all_visible_devices: false
  drop_remainder: true
  auto_scale_learning_rate: false
  log_device_summary: true
